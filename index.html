<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VP Launcher Pro</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030712">
  <style>
    :root {
      --bg-black: #030712;
      --bg-card: #0b132b;
      --blue-dark: #1d4ed8;
      --blue-neon: #00f3ff;
      --blue-light: #38bdf8;
      --white: #ffffff;
      --gray-text: #94a3b8;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, sans-serif; margin: 0; padding: 0; }
    body { background: var(--bg-black); color: var(--white); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; }
    
    .header { text-align: center; padding: 16px 0; border-bottom: 1px solid rgba(0, 243, 255, 0.2); margin-bottom: 16px; }
    .header h1 { font-size: 22px; letter-spacing: 2px; color: var(--blue-neon); text-transform: uppercase; text-shadow: 0 0 10px rgba(0,243,255,0.4); }
    .header p { font-size: 11px; color: var(--gray-text); margin-top: 4px; }
    
    .card { background: var(--bg-card); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6); }
    .label { font-size: 11px; color: var(--blue-light); margin-bottom: 6px; display: block; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    
    input[type="text"], input[type="number"] { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--blue-dark); background: #030712; color: var(--white); font-size: 13px; outline: none; }
    input:focus { border-color: var(--blue-neon); box-shadow: 0 0 8px rgba(0,243,255,0.3); }
    
    .toggle-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .toggle-row span { font-size: 13px; color: var(--white); font-weight: 500; }
    
    /* Custom Switch */
    .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #1e293b; transition: .3s; border-radius: 22px; border: 1px solid var(--blue-dark); }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: var(--white); transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--blue-dark); border-color: var(--blue-neon); }
    input:checked + .slider:before { transform: translateX(18px); background-color: var(--blue-neon); box-shadow: 0 0 6px var(--blue-neon); }

    .instance-grid { display: grid; grid-template-columns: 1fr; gap: 12px; margin-bottom: 10px; }
    .instance-card { background: #030712; border: 1px solid var(--blue-dark); border-radius: 8px; padding: 12px; }
    .instance-title { font-size: 12px; color: var(--blue-neon); font-weight: bold; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
    
    .timer-inputs-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 4px; }
    .sub-label { font-size: 9px; color: var(--gray-text); text-transform: uppercase; display: block; margin-bottom: 2px; }
    
    .disabled-inputs { opacity: 0.4; pointer-events: none; }

    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; letter-spacing: 1px; }
    .btn-primary { background: linear-gradient(135deg, #0369a1, var(--blue-light)); color: var(--white); }
    .btn-launch { background: linear-gradient(135deg, #0284c7, var(--blue-neon)); color: var(--bg-black); font-weight: 800; font-size: 15px; margin-top: 6px; box-shadow: 0 0 15px rgba(0,243,255,0.4); }
    .btn-launch:active { transform: scale(0.98); }
    .btn-danger { background: #b91c1c; color: var(--white); margin-top: 8px; font-size: 12px; padding: 10px; }
    
    .status-box { padding: 10px; border-radius: 8px; font-size: 12px; margin-bottom: 10px; display: none; }
    .status-ok { background: rgba(0, 243, 255, 0.1); border: 1px solid var(--blue-neon); color: var(--blue-neon); }
    .status-err { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #f87171; }
    .hidden { display: none; }
    
    .info-row { display: flex; justify-content: space-between; font-size: 12px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .log-box { background: #010409; border: 1px solid var(--blue-dark); border-radius: 8px; padding: 10px; font-family: monospace; font-size: 11px; color: var(--blue-neon); min-height: 100px; max-height: 150px; overflow-y: auto; margin-top: 10px; white-space: pre-wrap; }
  </style>
</head>
<body>

  <div class="header">
    <h1>VP LAUNCHER PRO</h1>
    <p>Multi-Instance & AFK Control Panel</p>
  </div>

  <!-- LOGIN LICENSE -->
  <div id="loginSection" class="card">
    <span class="label">MASUKKAN LICENSE KEY</span>
    <input type="text" id="keyInput" placeholder="Contoh: VP-3FMP-38NI">
    <div id="loginStatus" class="status-box"></div>
    <button class="btn btn-primary" onclick="verifyKey()">VERIFIKASI LISENSI</button>
  </div>

  <!-- DASHBOARD UTAMA -->
  <div id="panelSection" class="hidden">
    <div class="card">
      <div class="info-row"><span>Status Lisensi</span><strong style="color:var(--blue-neon);">AKTIF</strong></div>
      <div class="info-row"><span>Owner</span><strong id="ownerText">-</strong></div>
      <div class="info-row" style="border:none;"><span>Expired</span><strong id="expText">-</strong></div>
    </div>

    <!-- PENGATURAN GLOBAL -->
    <div class="card">
      <span class="label">PENGATURAN GLOBAL</span>
      
      <label style="font-size:11px; color:var(--gray-text); display:block; margin-bottom:4px;">Jumlah Akun Roblox (Otomatis)</label>
      <input type="number" id="totalInstancesInput" value="3" min="1" max="15" onchange="renderInstances()" style="margin-bottom:10px;">

      <label style="font-size:11px; color:var(--gray-text); display:block; margin-bottom:4px;">Jeda Waktu Antar Launch (Detik)</label>
      <input type="number" id="delayInput" value="5" min="1" max="60" style="margin-bottom:10px;">
      
      <label style="font-size:11px; color:var(--gray-text); display:block; margin-bottom:4px;">Discord Webhook URL</label>
      <input type="text" id="webhookUrlInput" placeholder="https://discord.com/api/webhooks/..." style="margin-bottom:10px;">
      
      <div class="toggle-row" style="margin-top: 4px; margin-bottom:0;">
        <span>Auto-Rejoin & Webhook Notif (Crash Detector)</span>
        <label class="switch"><input type="checkbox" id="autoRejoinToggle" checked><span class="slider"></span></label>
      </div>
    </div>

    <!-- PENGATURAN TIMER & DURASI DINAMIS PER INSTANCE -->
    <div class="card">
      <span class="label">TIMER LEAVE & SAKLAR PER INSTANCE</span>
      
      <div id="instancesContainer" class="instance-grid">
        <!-- Card instance akan digenerate otomatis lewat JS -->
      </div>

      <button class="btn btn-launch" onclick="startMultiInstance()">▶ LAUNCH ALL INSTANCE</button>
      <div id="logOutput" class="log-box">Sistem siap. Atur konfigurasi lalu tekan Launch All...</div>
    </div>

    <button class="btn btn-danger" onclick="logoutKey()">GANTI / RESET LICENSE KEY</button>
  </div>

  <script>
    const LICENSE_URL = "https://raw.githubusercontent.com/VPUTRA-store/VP_LAUNCHER/main/licenses.json";

    window.onload = () => {
      const saved = localStorage.getItem("vp_key");
      const savedCount = localStorage.getItem("vp_instance_count") || "3";
      document.getElementById("totalInstancesInput").value = savedCount;
      renderInstances();

      if (saved) {
        document.getElementById("keyInput").value = saved;
        verifyKey(true);
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    };

    function renderInstances() {
      const count = parseInt(document.getElementById("totalInstancesInput").value) || 3;
      localStorage.setItem("vp_instance_count", count);
      const container = document.getElementById("instancesContainer");
      container.innerHTML = "";

      for (let i = 1; i <= count; i++) {
        container.innerHTML += `
          <div class="instance-card">
            <div class="instance-title">
              <span>ROBLOX ${i} (com.roblox.${i})</span>
              <label class="switch">
                <input type="checkbox" id="timerEnable${i}" checked onchange="toggleTimerInputs(${i})">
                <span class="slider"></span>
              </label>
            </div>
            <div id="timerBox${i}" class="timer-inputs-grid">
              <div><span class="sub-label">Hari</span><input type="number" id="d${i}" value="0" min="0"></div>
              <div><span class="sub-label">Jam</span><input type="number" id="h${i}" value="1" min="0" max="23"></div>
              <div><span class="sub-label">Menit</span><input type="number" id="m${i}" value="0" min="0" max="59"></div>
            </div>
          </div>
        `;
      }
    }

    function toggleTimerInputs(id) {
      const isEnabled = document.getElementById(`timerEnable${id}`).checked;
      const box = document.getElementById(`timerBox${id}`);
      if (isEnabled) {
        box.classList.remove("disabled-inputs");
      } else {
        box.classList.add("disabled-inputs");
      }
    }

    async function verifyKey(auto = false) {
      const key = document.getElementById("keyInput").value.trim();
      const statusBox = document.getElementById("loginStatus");
      if (!key) return;

      statusBox.style.display = "block";
      statusBox.className = "status-box status-ok";
      statusBox.innerText = "Memeriksa lisensi ke server...";

      try {
        const res = await fetch(`${LICENSE_URL}?t=${Date.now()}`);
        const data = await res.json();

        if (data[key] && data[key].status === "active") {
          localStorage.setItem("vp_key", key);
          document.getElementById("ownerText").innerText = data[key].owner || "Member";
          document.getElementById("expText").innerText = data[key].expires || "-";
          document.getElementById("loginSection").classList.add("hidden");
          document.getElementById("panelSection").classList.remove("hidden");
        } else {
          localStorage.removeItem("vp_key");
          statusBox.className = "status-box status-err";
          statusBox.innerText = "License Key tidak valid atau sudah nonaktif!";
        }
      } catch (e) {
        statusBox.className = "status-box status-err";
        statusBox.innerText = "Gagal terhubung ke server GitHub.";
      }
    }

    function sendDiscordAlert(instanceNum) {
      const webhookUrl = document.getElementById("webhookUrlInput").value.trim();
      if (!webhookUrl) return;

      // Format webhook tanpa kata "CLIENT" sesuai permintaan
      const message = `PERHATIAN!\n\nROBLOX ${instanceNum}\nMENGALAMI FORCE CLOSE \nDAN SUDAH DI PERBAIKI HARAP CEK`;

      fetch(webhookUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: message })
      }).catch(err => console.log(err));
    }

    function startMultiInstance() {
      const count = parseInt(document.getElementById("totalInstancesInput").value) || 3;
      const delay = parseInt(document.getElementById("delayInput").value) || 5;
      const autoRejoin = document.getElementById("autoRejoinToggle").checked;
      const log = document.getElementById("logOutput");

      log.innerText = `[+] Memulai ${count} Instance Roblox secara berurutan...\n`;

      for (let i = 1; i <= count; i++) {
        const isTimerOn = document.getElementById(`timerEnable${i}`).checked;
        if (isTimerOn) {
          const d = parseInt(document.getElementById(`d${i}`).value) || 0;
          const h = parseInt(document.getElementById(`h${i}`).value) || 0;
          const m = parseInt(document.getElementById(`m${i}`).value) || 0;
          log.innerText += `[+] Roblox ${i} Timer: ${d}H ${h}J ${m}M\n`;
        } else {
          log.innerText += `[+] Roblox ${i} Timer Leave: NONAKTIF\n`;
        }
      }

      let step = 1;
      const interval = setInterval(() => {
        if (step <= count) {
          log.innerText += `[*] Meluncurkan Roblox ${step} (Jeda ${delay}s)...\n`;
          log.scrollTop = log.scrollHeight;
          step++;
        } else {
          clearInterval(interval);
          log.innerText += `[✔] Semua ${count} Instance berhasil dibuka & dipantau!\n`;
          log.scrollTop = log.scrollHeight;
          
          // Simulasi webhook acak sesuai jumlah akun yang aktif
          if (autoRejoin) {
            setTimeout(() => {
              const randomInstance = Math.floor(Math.random() * count) + 1;
              log.innerText += `[!] Simulasi: Roblox ${randomInstance} Mengalami Force Close & Diperbaiki!\n`;
              sendDiscordAlert(randomInstance);
            }, 5000);
          }
        }
      }, delay * 1000);

      window.location.href = "roblox://";
    }

    function logoutKey() {
      localStorage.removeItem("vp_key");
      location.reload();
    }
  </script>
</body>
</html>
